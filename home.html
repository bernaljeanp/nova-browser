<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva pestaña</title>
<style>
  :root { --bg: #0a0b10; --surface: #13151d; --surface-2: #1b1e29; --line: #262a38; --text: #e8e9f3; --muted: #8b8fa8; --accent: #7c6cff; --accent-2: #2fd4c7;
    --font: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; --mono: "Cascadia Code", Consolas, ui-monospace, monospace; }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  body { min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: var(--font); padding: 16px; }
  main { width: min(720px, 100%); display: grid; gap: 28px; justify-items: center; margin-top: -4vh; }
  .hero { display: grid; justify-items: center; gap: 2px; }
  #planet { width: 220px; height: 170px; }
  h1 { font-size: 40px; font-weight: 650; letter-spacing: -.03em; }
  .saved { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 7px 14px; border-radius: 99px; background: #2fd4c714; color: #bfeee9;
    font-size: 14px; text-decoration: none; transition: background .15s; }
  .saved b { color: #fff; font-weight: 650; }
  .saved:hover, .saved:focus-visible { background: #2fd4c726; outline: 0; }
  form { width: 100%; display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 20px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); transition: border-color .15s; }
  form:focus-within { border-color: var(--accent); }
  svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
  input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: 16px var(--font); }
  input::placeholder { color: var(--muted); }
  kbd { padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; color: var(--muted); font: 12px var(--mono); }

  #favs { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .tile { position: relative; }
  .tile > a:first-child { display: grid; justify-items: center; gap: 10px; padding: 16px 8px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
    color: var(--muted); font-size: 12.5px; text-decoration: none; transition: border-color .15s, background .15s, color .15s; }
  .tile > a:first-child:hover, .tile > a:first-child:focus-visible { border-color: var(--accent); background: var(--surface-2); color: var(--text); outline: 0; }
  .ico { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font: 650 18px var(--font); color: #fff; overflow: hidden; }
  .ico img { width: 24px; height: 24px; }
  /* Real logos sit on a light tile so dark marks (GitHub, Netflix's black) stay visible. */
  .ico.logo { background: #f3f4f8; }
  .name { width: 100%; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .rm { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; opacity: 0; transition: opacity .12s, background .12s; }
  .rm svg { width: 12px; height: 12px; }
  .tile:hover .rm, .rm:focus-visible { opacity: 1; }
  .rm:hover { background: var(--line); }

  .import { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; color: var(--muted); font-size: 13.5px; }
  .import a { padding: 7px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 13px; transition: border-color .15s; }
  .import a:hover, .import a:focus-visible { border-color: var(--accent-2); outline: 0; }
  .tips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <main>
    <div class="hero">
      <canvas id="planet" aria-hidden="true"></canvas>
      <h1>Nova</h1>
      <a class="saved" id="saved" href="https://nova.invalid/wrapped" hidden></a>
    </div>
    <form action="https://www.google.com/search" method="get" role="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input name="q" autofocus placeholder="Buscar con Google" aria-label="Buscar">
      <kbd>Ctrl K</kbd>
    </form>

    <div id="favs" aria-label="Favoritos"></div>

    <div class="import" id="import">
      <span>¿Vienes de otro navegador? Trae tus favoritos e historial:</span>
      <a href="https://nova.invalid/import/Chrome">Chrome</a>
      <a href="https://nova.invalid/import/Edge">Edge</a>
      <a href="https://nova.invalid/import/Brave">Brave</a>
    </div>

    <div class="tips">
      <span><kbd>Ctrl D</kbd> guardar en favoritos</span>
      <span><kbd>Ctrl K</kbd> buscar todo</span>
      <span><kbd>Ctrl Shift P</kbd> video flotante</span>
    </div>
  </main>
<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
  // Letter tile tinted per site, so favorites without a saved icon still read at a glance.
  const tint = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return `linear-gradient(135deg, hsl(${h} 60% 46%), hsl(${(h + 40) % 360} 65% 36%))`; };
  const X = '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>';

  // Nova's main process calls this with { sites, mine, icons: { host: dataUrl }, stats }.
  // mine = false means default sites (+ the import offer) because the user has no favorites yet.
  const dur = s => s < 3600 ? `${Math.max(1, Math.round(s / 60))} min` : `${Math.floor(s / 3600)} h ${Math.round(s / 60) % 60} min`;
  window.renderHome = ({ sites, mine, icons, stats }) => {
    document.getElementById('import').hidden = mine;
    document.getElementById('favs').innerHTML = sites.map(b => {
      const h = host(b.url), name = b.title && b.title !== b.url ? b.title : h;
      const logo = icons[h] || (/^https:/.test(b.favicon || '') ? b.favicon : '');
      const letter = esc((name[0] || '?').toUpperCase());
      const icon = logo
        ? `<span class="ico logo"><img src="${esc(logo)}" alt="" onerror="this.parentNode.className='ico';this.parentNode.style.background='${tint(h)}';this.parentNode.textContent='${letter}'"></span>`
        : `<span class="ico" style="background:${tint(h)}">${letter}</span>`;
      return `<div class="tile"><a href="${esc(b.url)}" title="${esc(name)}">${icon}<span class="name">${esc(name)}</span></a>${mine
        ? `<a class="rm" href="https://nova.invalid/unbookmark?url=${encodeURIComponent(b.url)}" title="Quitar" aria-label="Quitar ${esc(name)} de favoritos">${X}</a>` : ''}</div>`;
    }).join('');
    const el = document.getElementById('saved');
    el.hidden = !stats.saved;
    if (stats.saved) el.innerHTML = `Nova te devolvió <b>${dur(stats.saved)}</b> este mes · ver mi Wrapped →`;
  };

  // The Nova eclipse: a dark disc whose corona of light slowly turns. 2D canvas keeps it cheap on RAM/GPU;
  // requestAnimationFrame pauses by itself when the tab is hidden; reduced motion gets one still frame.
  const cv = document.getElementById('planet'), g = cv.getContext('2d');
  const W = 220, H = 170, dpr = devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; g.scale(dpr, dpr);
  const C = { x: W / 2, y: H / 2 }, R = 52;
  const stars = Array.from({ length: 22 }, (_, i) => ({ x: (i * 97.3) % W, y: (i * 57.1 + 13) % H, p: i * 1.7, r: i % 4 ? 0.7 : 1.1 }));
  function frame(t) {
    const s = t / 1000, rot = -0.9 + s * 0.35, breathe = 0.85 + 0.15 * Math.sin(s * 0.9);
    g.clearRect(0, 0, W, H);
    for (const st of stars) { g.globalAlpha = .25 + .35 * (0.5 + 0.5 * Math.sin(s * 1.3 + st.p)); g.fillStyle = '#cfd3ff'; g.fillRect(st.x, st.y, st.r, st.r); }
    // corona: a soft halo, brighter on the side the light is turning toward
    const lx = C.x + Math.cos(rot) * 14, ly = C.y + Math.sin(rot) * 14;
    const halo = g.createRadialGradient(lx, ly, R * 0.9, C.x, C.y, R * 1.62);
    halo.addColorStop(0, 'rgba(124,243,232,0)'); halo.addColorStop(.25, `rgba(124,243,232,${.55 * breathe})`);
    halo.addColorStop(.5, `rgba(154,140,255,${.45 * breathe})`); halo.addColorStop(1, 'rgba(106,92,240,0)');
    g.globalAlpha = 1; g.fillStyle = halo; g.beginPath(); g.arc(C.x, C.y, R * 1.62, 0, 7); g.fill();
    // rim: a bright arc of light sweeping around the disc
    const rim = g.createConicGradient(rot, C.x, C.y);
    rim.addColorStop(0, '#e6fffb'); rim.addColorStop(.18, '#9a8cff'); rim.addColorStop(.45, 'rgba(124,108,255,0)');
    rim.addColorStop(.9, 'rgba(124,108,255,0)'); rim.addColorStop(1, '#e6fffb');
    g.strokeStyle = rim; g.lineWidth = 4; g.beginPath(); g.arc(C.x, C.y, R + 1, 0, 7); g.stroke();
    // the moon in front, offset away from the light
    g.fillStyle = '#07080d'; g.beginPath(); g.arc(C.x - Math.cos(rot) * 7, C.y - Math.sin(rot) * 7, R - 1, 0, 7); g.fill();
  }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) frame(1800);
  else (function loop(t) { frame(t); requestAnimationFrame(loop); })(0);
</script>
</body>
</html>
