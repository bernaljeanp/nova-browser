<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Modo cocina</title>
<style>
  :root { --bg: #0a0b10; --surface: #13151d; --surface-2: #1b1e29; --line: #262a38; --text: #eef0f8; --muted: #9a9db5; --accent: #7c6cff; --accent-2: #2fd4c7; --warn: #ffb547;
    --font: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; --mono: "Cascadia Code", Consolas, monospace; }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; animation: in .35s ease-out; }
  @keyframes in { from { opacity: 0; transform: scale(.985); } }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .app { height: 100%; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; }
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
  .hero { position: relative; height: 190px; flex: none; background: var(--surface-2) center/cover; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 35%, var(--surface)); }
  .head { padding: 0 22px 14px; margin-top: -42px; position: relative; z-index: 1; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: #2fd4c71f; color: var(--accent-2); font-size: 12px; font-weight: 600; }
  h1 { margin-top: 10px; font-size: 22px; line-height: 1.25; font-weight: 700; }
  .meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; color: var(--muted); font-size: 13px; }
  .serv { display: flex; align-items: center; gap: 10px; margin: 4px 22px 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 14px; }
  .serv span { flex: 1; }
  .serv button { width: 32px; height: 32px; border-radius: 9px; background: var(--bg); font-size: 18px; font-weight: 600; }
  .serv b { min-width: 28px; text-align: center; font-size: 17px; font-variant-numeric: tabular-nums; }
  .ing { flex: 1; overflow-y: auto; padding: 4px 14px 20px; }
  .ing h2 { padding: 8px 8px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .ing label { display: flex; gap: 12px; align-items: flex-start; padding: 9px 8px; border-radius: 9px; font-size: 15px; line-height: 1.45; cursor: pointer; }
  .ing label:hover { background: var(--surface-2); }
  .ing input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent-2); flex: none; }
  .ing input:checked + span { color: var(--muted); text-decoration: line-through; }
  .ing q { quotes: none; color: var(--accent-2); font-weight: 650; }

  main { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 26px clamp(20px, 5vw, 64px) 22px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .dots { flex: 1; display: flex; gap: 5px; }
  .dots i { flex: 1; max-width: 46px; height: 4px; border-radius: 2px; background: var(--line); transition: background .2s; }
  .dots i.done { background: var(--accent); }
  .dots i.now { background: var(--accent-2); }
  .close { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: 13px; }
  .close:hover { color: var(--text); }
  .step { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 900px; min-height: 0; }
  .num { color: var(--accent-2); font-size: 15px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .txt { margin-top: 14px; font-size: clamp(22px, 2.6vw, 34px); line-height: 1.45; font-weight: 500; overflow-y: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .chip { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; background: #ffb5471f; color: var(--warn); font-weight: 600; font-size: 15px; }
  .chip:hover { background: #ffb54733; }
  .nav { display: flex; gap: 12px; }
  .nav button { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 14px; background: var(--surface-2); font-size: 16px; font-weight: 600; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav .next { margin-left: auto; background: #5b4bdb; color: #fff; }
  .hint { margin-top: 12px; color: var(--muted); font-size: 12.5px; }
  .tm { position: absolute; right: clamp(20px, 5vw, 64px); top: 76px; display: grid; gap: 8px; }
  .tmr { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 10px 30px #0008; }
  .tmr b { font: 600 22px var(--mono); font-variant-numeric: tabular-nums; }
  .tmr small { display: block; color: var(--muted); font-size: 11.5px; max-width: 160px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tmr.ring { border-color: var(--warn); background: #2a2010; }
  .tmr button { width: 30px; height: 30px; border-radius: 8px; color: var(--muted); }
  .done-card { text-align: center; }
  .done-card .txt { font-size: 38px; font-weight: 700; }
  /* Video and Producto lenses */
  .gen { height: 100%; display: grid; grid-template-columns: minmax(300px, 400px) 1fr; }
  .gside { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 22px; }
  .gside .pic { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; background: var(--surface-2); }
  .gside .pic.sq { aspect-ratio: 1; object-fit: contain; background: #fff; }
  .gside h1 { font-size: 20px; margin-top: 16px; }
  .sub { margin-top: 6px; color: var(--muted); font-size: 14px; }
  .price { margin-top: 16px; font-size: 34px; font-weight: 750; letter-spacing: -.02em; }
  .stars { margin-top: 8px; color: var(--warn); font-size: 15px; }
  .stars span { color: var(--muted); }
  .chap { margin-top: 22px; }
  .chap h2, .gmain h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .row { display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 8px; border-radius: 9px; text-align: left; font-size: 14px; }
  .row:hover { background: var(--surface-2); }
  .ts { flex: none; padding: 1px 7px; border-radius: 6px; background: #2fd4c71f; color: var(--accent-2); font: 600 12.5px var(--mono); }
  .gmain { position: relative; overflow-y: auto; padding: 26px clamp(20px, 5vw, 64px); }
  .gtop { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .gtop .close { margin-left: auto; }
  .lead { font-size: clamp(20px, 2.2vw, 28px); line-height: 1.45; font-weight: 600; max-width: 860px; }
  .cards { display: grid; gap: 12px; margin-top: 24px; max-width: 860px; }
  .idea { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: baseline; width: 100%; padding: 16px 18px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--line); text-align: left; animation: in .3s ease-out; transition: border-color .15s; }
  .idea:hover { border-color: var(--accent-2); }
  .idea b { font-size: 16.5px; }
  .idea p { grid-column: 2; color: #c3c6db; font-size: 14.5px; line-height: 1.5; }
  .verdict { padding: 22px 24px; border-radius: 16px; background: linear-gradient(135deg, #2a2160, #13151d 70%); border: 1px solid #3a3470; max-width: 860px; }
  .verdict small { color: #b9b0ff; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
  .verdict p { margin-top: 8px; font-size: 22px; line-height: 1.4; font-weight: 600; }
  .for { margin-top: 14px; color: #c3c6db; font-size: 15px; max-width: 860px; }
  .pc { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; max-width: 860px; }
  .pc ul { list-style: none; padding: 0; display: grid; gap: 10px; }
  .pc li { padding: 12px 14px 12px 40px; position: relative; border-radius: 12px; background: var(--surface); font-size: 14.5px; line-height: 1.45; animation: in .3s ease-out; }
  .pc li::before { position: absolute; left: 14px; top: 11px; font-weight: 800; }
  .pros li::before { content: "+"; color: #4ade80; }
  .cons li::before { content: "−"; color: #fb7185; }
  .note { margin-top: 22px; padding: 14px 16px; border-radius: 12px; background: var(--surface); color: var(--muted); font-size: 14px; max-width: 860px; }
  .wait { color: var(--muted); }
  .wait::after { content: "…"; }
  @media (max-width: 760px) { .app, .gen { grid-template-columns: 1fr; } aside, .gside { display: none; } .pc { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { body { animation: none; } }
</style>
</head>
<body>
  <div class="app" id="recipe">
    <aside>
      <div class="hero" id="hero"></div>
      <div class="head">
        <span class="tag"><svg viewBox="0 0 24 24"><path d="M6 13.9A4 4 0 1 1 9 7a5 5 0 0 1 6 0 4 4 0 1 1 3 6.9V20H6z"/><path d="M6 17h12"/></svg>Lente · Modo cocina</span>
        <h1 id="title"></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="serv" id="serv" hidden><span>Porciones</span><button id="less" aria-label="Menos porciones">−</button><b id="srv"></b><button id="more" aria-label="Más porciones">+</button></div>
      <div class="ing"><h2>Ingredientes</h2><div id="ings"></div></div>
    </aside>
    <main>
      <div class="top">
        <span class="count" id="count"></span>
        <div class="dots" id="dots"></div>
        <button class="close" id="close" title="Volver a la página (Esc)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Volver a la página</button>
      </div>
      <div class="tm" id="timers"></div>
      <div class="step" id="step"></div>
      <div class="nav"><button id="prev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Anterior</button><button class="next" id="next">Siguiente<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button></div>
      <p class="hint">Flechas o barra espaciadora para avanzar · la pantalla no se apagará mientras cocinas</p>
    </main>
  </div>
  <div class="gen" id="gen" hidden></div>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let R = null, i = 0, base = 0, srv = 0;

  // ISO 8601 durations (PT1H30M) -> "1 h 30 min"
  const iso = d => { const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?/.exec(d || ''); if (!m) return ''; const h = (+m[1] || 0) * 24 + (+m[2] || 0), mi = +m[3] || 0; return [h && h + ' h', mi && mi + ' min'].filter(Boolean).join(' '); };
  // Quantities: "1 1/2", "3/4", "250", "0,5", "½" -> number; scaled back to a friendly string.
  const FR = { '½': .5, '¼': .25, '¾': .75, '⅓': 1 / 3, '⅔': 2 / 3 };
  const QTY = /^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])/;
  const toNum = s => s in FR ? FR[s] : s.includes('/') ? s.split(/\s+/).reduce((a, p) => a + (p.includes('/') ? p.split('/')[0] / p.split('/')[1] : +p), 0) : +s.replace(',', '.');
  const fmt = n => { const w = Math.floor(n), f = n - w, near = [[0, ''], [.25, '¼'], [1 / 3, '⅓'], [.5, '½'], [2 / 3, '⅔'], [.75, '¾'], [1, '']].reduce((a, b) => Math.abs(b[0] - f) < Math.abs(a[0] - f) ? b : a);
    if (n >= 10 || Math.abs(near[0] - f) > .06) return (Math.round(n * 10) / 10).toLocaleString('es');
    const whole = w + (near[0] === 1 ? 1 : 0); return (whole ? whole : '') + (near[1] ? (whole ? ' ' : '') + near[1] : '') || '0'; };

  function drawIngredients() {
    const k = base && srv ? srv / base : 1;
    $('ings').innerHTML = R.ingredients.map((t, n) => {
      const m = QTY.exec(t);
      const shown = m && k !== 1 ? `<q>${fmt(toNum(m[1]) * k)}</q>${esc(t.slice(m[1].length))}` : m ? `<q>${esc(m[1])}</q>${esc(t.slice(m[1].length))}` : esc(t);
      return `<label><input type="checkbox" data-n="${n}"><span>${shown}</span></label>`;
    }).join('');
  }

  // Durations inside a step become one-tap timers.
  const TIME = /(\d+(?:[.,]\d+)?)(?:\s*(?:a|-)\s*(\d+))?\s*(horas?|h\b|minutos?|min\b|segundos?|seg\b)/gi;
  const timersIn = text => [...text.matchAll(TIME)].map(m => { const n = +(m[2] || m[1]).replace(',', '.'), u = m[3][0].toLowerCase(); return { sec: Math.round(n * (u === 'h' ? 3600 : u === 's' ? 1 : 60)), label: m[0] }; }).filter(t => t.sec > 0 && t.sec <= 86400);

  function drawStep() {
    const n = R.steps.length, done = i >= n;
    $('count').textContent = done ? '¡Listo!' : `Paso ${i + 1} de ${n}`;
    $('dots').innerHTML = R.steps.map((_, k) => `<i class="${k < i ? 'done' : k === i ? 'now' : ''}"></i>`).join('');
    $('prev').disabled = i === 0;
    $('next').innerHTML = done ? 'Volver a la página' : i === n - 1 ? 'Terminar' : 'Siguiente<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>';
    if (done) { $('step').innerHTML = '<div class="done-card"><p class="num">Receta terminada</p><p class="txt">¡Buen provecho!</p></div>'; return; }
    const t = R.steps[i], tms = timersIn(t);
    $('step').innerHTML = `<p class="num">Paso ${i + 1}</p><p class="txt">${esc(t)}</p>` +
      (tms.length ? `<div class="chips">${tms.map(x => `<button class="chip" data-sec="${x.sec}" data-label="${esc('Paso ' + (i + 1) + ' · ' + x.label)}"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Temporizador ${esc(x.label)}</button>`).join('')}</div>` : '');
  }

  // Timers keep running while you move between steps; a beep and a highlighted card when they finish.
  const timers = [];
  function beep() { try { const a = new AudioContext(); [0, .35, .7].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.25, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .3); o.start(a.currentTime + t); o.stop(a.currentTime + t + .3); }); } catch (e) {} }
  function drawTimers() {
    const now = Date.now();
    $('timers').innerHTML = timers.map((t, k) => { const left = Math.max(0, Math.round((t.end - now) / 1000));
      return `<div class="tmr${left ? '' : ' ring'}"><div><b>${left ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : '¡Listo!'}</b><small>${esc(t.label)}</small></div><button data-k="${k}" aria-label="Quitar temporizador">✕</button></div>`; }).join('');
  }
  setInterval(() => { timers.forEach(t => { if (!t.rang && t.end <= Date.now()) { t.rang = true; beep(); } }); if (timers.length) drawTimers(); }, 500);
  $('step').onclick = e => { const c = e.target.closest('.chip'); if (c) { timers.push({ end: Date.now() + c.dataset.sec * 1000, label: c.dataset.label }); drawTimers(); } };
  $('timers').onclick = e => { const b = e.target.closest('button'); if (b) { timers.splice(+b.dataset.k, 1); drawTimers(); } };

  const go = d => { i = Math.max(0, Math.min(R.steps.length, i + d)); drawStep(); };
  $('prev').onclick = () => go(-1);
  $('next').onclick = () => i >= R.steps.length ? nova.cmd('lensClose') : go(1);
  $('close').onclick = () => nova.cmd('lensClose');
  $('less').onclick = () => { if (srv > 1) { srv--; $('srv').textContent = srv; drawIngredients(); } };
  $('more').onclick = () => { srv++; $('srv').textContent = srv; drawIngredients(); };
  addEventListener('keydown', e => {
    if (e.key === 'Escape') nova.cmd('lensClose');
    else if (KIND !== 'recipe') return;
    else if (e.key === 'ArrowRight' || (e.key === ' ' && e.target === document.body)) { e.preventDefault(); $('next').click(); }
    else if (e.key === 'ArrowLeft') go(-1);
  });

  // ---------- AI: jobs run on the Nova IA engine; answers stream back as KIND|field|field lines ----------
  let KIND = 'recipe', jobSeq = 0;
  const onAI = {};
  nova.on('lens-ai', m => onAI[m.id]?.(m));
  function askAI(system, user, onLine, onEnd) {
    const id = `lens-${Date.now()}-${++jobSeq}`;
    let buf = '';
    onAI[id] = m => {
      if (m.t) { buf += m.t; let nl; while ((nl = buf.indexOf('\n')) >= 0) { onLine(buf.slice(0, nl).trim()); buf = buf.slice(nl + 1); } }
      if (m.done || m.error) { if (buf.trim()) onLine(buf.trim()); delete onAI[id]; onEnd(m.error); }
    };
    nova.cmd('lensAI', { id, messages: [{ role: 'system', content: system }, { role: 'user', content: user }] });
  }
  const parts = line => line.replace(/^[-*•\s]+/, '').split('|').map(s => s.trim());
  const cut = (s, n) => s && s.length > n ? s.slice(0, n) + '\n[…]' : (s || '');
  const toSec = t => t.split(':').reduce((a, n) => a * 60 + +n, 0);
  const noAI = err => `<div class="note">${err === 'noengine'
    ? 'Para esta parte, activa Nova IA una vez: abre el panel con <b>Ctrl+J</b>. Corre en tu equipo, gratis y privado.'
    : 'No se pudo generar con la IA: ' + esc(err)}</div>`;
  const closeBtn = label => `<button class="close" onclick="nova.cmd('lensClose')"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>${label}</button>`;
  $('gen').onclick = e => { const b = e.target.closest('[data-s]'); if (b) nova.cmd('seek', +b.dataset.s); };

  function renderVideo(v) {
    const chapters = [...(v.description || '').matchAll(/^\s*(\d{1,2}:\d{2}(?::\d{2})?)\s*[-–—:]?\s*(.+)$/gm)].slice(0, 30);
    $('gen').innerHTML = `
      <aside class="gside">
        <img class="pic" src="https://i.ytimg.com/vi/${encodeURIComponent(v.id || '')}/hqdefault.jpg" alt="">
        <h1>${esc(v.title || 'Video')}</h1><p class="sub">${esc(v.channel || '')}</p>
        ${chapters.length ? `<div class="chap"><h2>Capítulos</h2>${chapters.map(c => `<button class="row" data-s="${toSec(c[1])}"><span class="ts">${esc(c[1])}</span>${esc(c[2])}</button>`).join('')}</div>` : ''}
      </aside>
      <section class="gmain">
        <div class="gtop"><span class="tag">Lente · Video en 1 minuto</span>${closeBtn('Volver al video')}</div>
        <h2>En 1 minuto</h2>
        <p class="lead wait" id="sum">Nova está viendo el video por ti</p>
        <div class="cards" id="ideas"></div><div id="vnote"></div>
      </section>`;
    const src = v.transcript ? `Transcripción con marcas de tiempo:\n${cut(v.transcript, 14000)}` : `El video no tiene subtítulos. Descripción:\n${cut(v.description, 6000)}`;
    askAI('Eres Nova IA. Responde solo en español y solo con líneas en este formato exacto, sin texto adicional:\nRESUMEN|una frase clara que explique de qué trata el video\nIDEA|m:ss|título corto|una frase que lo explique\nEscribe entre 5 y 8 líneas IDEA en orden, usando marcas de tiempo reales de la transcripción.',
      `Video: ${v.title}\nCanal: ${v.channel}\n\n${src}`,
      line => {
        const [k, a, b, c] = parts(line);
        if (/^RESUMEN$/i.test(k) && a) { $('sum').classList.remove('wait'); $('sum').textContent = a; }
        if (/^IDEA$/i.test(k) && b) {
          const ts = /^\d{1,2}(:\d{2}){1,2}$/.test(a) ? a : '';
          $('ideas').insertAdjacentHTML('beforeend', `<button class="idea" ${ts ? `data-s="${toSec(ts)}"` : ''}>${ts ? `<span class="ts">${esc(ts)}</span>` : '<span></span>'}<b>${esc(b)}</b>${c ? `<p>${esc(c)}</p>` : ''}</button>`);
        }
      },
      err => {
        if ($('sum').classList.contains('wait')) { $('sum').classList.remove('wait'); $('sum').textContent = err ? (chapters.length ? 'Usa los capítulos para saltar a lo que te interesa.' : 'Este video aún no tiene resumen.') : ''; }
        $('vnote').innerHTML = err ? noAI(err) : v.transcript ? '' : '<div class="note">Este video no tiene subtítulos: el resumen se basa en su descripción.</div>';
      });
  }

  function renderProduct(p) {
    const price = p.price ? (() => { try { return new Intl.NumberFormat('es', { style: 'currency', currency: p.currency || 'USD', maximumFractionDigits: 0 }).format(+p.price); } catch (e) { return p.price + ' ' + p.currency; } })() : '';
    const stars = p.rating ? '★'.repeat(Math.round(p.rating)) + '☆'.repeat(5 - Math.round(p.rating)) : '';
    const avail = /InStock/i.test(p.availability) ? 'Disponible' : /OutOfStock/i.test(p.availability) ? 'Agotado' : '';
    $('gen').innerHTML = `
      <aside class="gside">
        ${p.image ? `<img class="pic sq" src="${esc(p.image)}" alt="">` : ''}
        <h1>${esc(p.name)}</h1>${p.brand ? `<p class="sub">${esc(p.brand)}</p>` : ''}
        ${price ? `<p class="price">${esc(price)}</p>` : ''}
        ${stars ? `<p class="stars">${stars} <span>${p.rating.toLocaleString('es')}${p.count ? ` · ${p.count.toLocaleString('es')} opiniones` : ''}</span></p>` : ''}
        ${avail ? `<p class="sub">${avail}</p>` : ''}
      </aside>
      <section class="gmain">
        <div class="gtop"><span class="tag">Lente · Decidir compra</span>${closeBtn('Volver a la tienda')}</div>
        <div class="verdict"><small>Veredicto de Nova</small><p class="wait" id="ver">Nova está leyendo la página y las opiniones</p></div>
        <p class="for" id="for"></p>
        <div class="pc"><div><h2>A favor</h2><ul class="pros" id="pros"></ul></div><div><h2>En contra</h2><ul class="cons" id="cons"></ul></div></div>
        <div id="pnote"></div>
      </section>`;
    askAI('Eres Nova IA, un asesor de compras honesto. Responde solo en español y solo con líneas en este formato exacto, sin texto adicional:\nVEREDICTO|una frase: si vale la pena y por qué\nPARA|para quién es ideal, en una frase\nPRO|un punto a favor concreto (escribe 3)\nCONTRA|un punto en contra concreto (escribe 3)\nBasate en la información y opiniones de la página; si algo no está, no lo inventes.',
      `Producto: ${p.name}\nMarca: ${p.brand}\nPrecio: ${price}\nValoración: ${p.rating || 'sin datos'} (${p.count || 0} opiniones)\nDescripción: ${p.description}\n\nTexto de la página (incluye opiniones):\n${cut(p.text, 12000)}`,
      line => {
        const [k, a] = parts(line);
        if (!a) return;
        if (/^VEREDICTO$/i.test(k)) { $('ver').classList.remove('wait'); $('ver').textContent = a; }
        if (/^PARA$/i.test(k)) $('for').textContent = 'Ideal para: ' + a;
        if (/^PRO$/i.test(k)) $('pros').insertAdjacentHTML('beforeend', `<li>${esc(a)}</li>`);
        if (/^CONTRA$/i.test(k)) $('cons').insertAdjacentHTML('beforeend', `<li>${esc(a)}</li>`);
      },
      err => {
        if ($('ver').classList.contains('wait')) { $('ver').classList.remove('wait'); $('ver').textContent = err ? 'Sin veredicto todavía.' : 'Revisa los puntos a favor y en contra.'; }
        $('pnote').innerHTML = err ? noAI(err) : '';
      });
  }

  nova.on('lens-data', ({ kind, data }) => {
    KIND = kind;
    $('recipe').hidden = kind !== 'recipe';
    $('gen').hidden = kind === 'recipe';
    if (kind === 'video') return renderVideo(data);
    if (kind === 'product') return renderProduct(data);
    R = data; i = 0;
    $('hero').style.backgroundImage = R.image ? `url("${R.image.replace(/"/g, '%22')}")` : '';
    $('title').textContent = R.title;
    const time = iso(R.time);
    $('meta').innerHTML = [time && `${esc(time)}`, R.yield && `${esc(R.yield)}`, `${R.steps.length} pasos`].filter(Boolean).join('<span>·</span>');
    base = srv = parseInt(R.yield) || 0;
    $('serv').hidden = !base;
    $('srv').textContent = srv;
    drawIngredients(); drawStep(); drawTimers();
    navigator.wakeLock?.request('screen').catch(() => {}); // keep the screen on while cooking
  });
</script>
</body>
</html>
