<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Nova</title>
<style>
  :root {
    --bg: #0a0b10; --surface: #13151d; --surface-2: #1b1e29; --line: #262a38;
    --text: #e8e9f3; --muted: #8b8fa8; --accent: #7c6cff; --accent-2: #2fd4c7; --danger: #ff6b7a;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Code", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  /* Transparent: this view grows over the page when the palette opens. */
  html, body { height: 100%; background: transparent; color: var(--text); font: 13px/1 var(--font); overflow: hidden; user-select: none; }
  [hidden] { display: none !important; }

  /* Tab strip doubles as the window drag area; right gap leaves room for native window controls. */
  #strip { height: 38px; display: flex; align-items: flex-end; gap: 2px; padding: 0 140px 0 10px; background: var(--bg); -webkit-app-region: drag; }
  .brand { display: flex; align-items: center; gap: 7px; height: 38px; padding-right: 12px; font-weight: 650; letter-spacing: .02em; }
  .brand img { width: 20px; height: 20px; }
  #tabs { display: flex; gap: 2px; min-width: 0; flex: 0 1 auto; overflow: hidden; }
  .tab { -webkit-app-region: no-drag; position: relative; display: flex; align-items: center; gap: 8px; height: 31px; width: 210px; min-width: 64px; flex: 0 1 210px;
    padding: 0 6px 0 11px; border-radius: 9px 9px 0 0; color: var(--muted); cursor: default; transition: background .15s, color .15s; }
  .tab:hover { background: #ffffff08; color: var(--text); }
  .tab.on, .tab.split { background: var(--surface); color: var(--text); }
  .tab.on::after { content: ""; position: absolute; left: 12px; right: 12px; top: 0; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .tab.split::after { content: ""; position: absolute; left: 12px; right: 12px; top: 0; height: 2px; border-radius: 2px; background: var(--line); }
  .tab.sleep { opacity: .55; }
  .tab img, .tab .dot { width: 16px; height: 16px; flex: none; border-radius: 3px; }
  .tab .dot { background: var(--surface-2); }
  .tab.loading .dot { animation: spin .8s linear infinite; border-radius: 50%; background: none; border: 2px solid var(--line); border-top-color: var(--accent-2); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab b { flex: none; min-width: 16px; padding: 2px 4px; border-radius: 6px; background: #ff6b7a26; color: var(--danger); font: 600 10px var(--mono); text-align: center; }
  .tab button { width: 22px; height: 22px; }
  #mini { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 2px; height: 28px; margin: 0 8px 4px 0; padding: 0 10px 0 3px; flex: 0 1 230px; min-width: 120px;
    border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  #mini button { width: 24px; height: 24px; border-radius: 12px; flex: none; }
  #mini svg { width: 13px; height: 13px; }
  #mplay { color: var(--accent-2); }
  #mtitle { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; color: var(--muted); cursor: pointer; padding-left: 4px; }
  #mtitle:hover { color: var(--text); }
  #new { -webkit-app-region: no-drag; width: 30px; height: 30px; margin: 0 0 1px 4px; flex: none; }

  #favbar { height: 32px; display: flex; align-items: center; gap: 2px; padding: 0 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
  #favs { flex: 1; min-width: 0; display: flex; gap: 2px; overflow: hidden; }
  .bm { display: flex; align-items: center; gap: 7px; width: auto; max-width: 180px; height: 26px; padding: 0 9px 0 7px; flex: none; border-radius: 7px; color: #c3c6db; font-size: 12.5px; }
  .bm img, .bm i { width: 16px; height: 16px; flex: none; border-radius: 4px; }
  .bm img { padding: 1px; background: #f3f4f8; } /* dark logos (GitHub) stay visible on the dark bar */
  .bm i { display: grid; place-items: center; font: 700 9px var(--font); color: #fff; font-style: normal; }
  .bm span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #favmore { width: 28px; height: 26px; font-size: 15px; flex: none; }
  #bar { position: relative; height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
  button { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; font: inherit; }
  button:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  button:disabled { opacity: .3; cursor: default; }
  button.on { color: var(--accent-2); background: #2fd4c714; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sep { width: 1px; height: 20px; margin: 0 4px; background: var(--line); }

  .field { flex: 1; display: flex; align-items: center; gap: 8px; height: 32px; margin: 0 6px; padding: 0 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); transition: border-color .15s, box-shadow .15s; }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px #7c6cff2a; }
  .field > svg { color: var(--accent-2); flex: none; width: 14px; height: 14px; }
  .field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: 13px var(--font); }
  .field input::placeholder { color: var(--muted); }
  .field kbd { flex: none; }
  button.mini { width: 26px; height: 26px; border-radius: 7px; }
  #star.on { color: #ffc861; background: none; }
  #star.on svg { fill: currentColor; }
  .tab .x { opacity: 0; transition: opacity .12s; }
  .tab:hover .x, .tab.on .x, .tab .x:focus-visible { opacity: 1; }
  .tab .snd { width: 22px; height: 22px; color: var(--accent-2); }
  .tab .snd.muted { color: var(--muted); }
  #findbar button { width: 26px; height: 26px; }
  #hits { color: var(--muted); font: 12px var(--mono); min-width: 52px; text-align: right; }
  kbd { padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; color: var(--muted); font: 11px var(--mono); }

  #errs { width: auto; gap: 6px; padding: 0 10px; color: var(--danger); background: #ff6b7a14; font: 600 12px var(--mono); display: flex; }
  #errs:hover { background: #ff6b7a26; color: var(--danger); }
  #shield { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; background: #2fd4c714; color: var(--accent-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  #shield svg { width: 14px; height: 14px; }

  #toast { position: absolute; left: 50%; top: 7px; transform: translate(-50%, -4px); padding: 8px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line);
    color: var(--text); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; box-shadow: 0 8px 24px #0008; z-index: 2; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Command palette */
  #pal { position: fixed; inset: 0; display: grid; justify-items: center; align-content: start; padding: 96px 16px 16px; background: #05060acc; }
  .box { width: min(680px, 100%); border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 24px 64px #000a; overflow: hidden; animation: pop .14s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.985); } }
  .box .field { margin: 10px; height: 44px; }
  .box .field input { font-size: 15px; }
  #res { list-style: none; padding: 0 6px 6px; max-height: min(420px, 60vh); overflow-y: auto; }
  #res::-webkit-scrollbar { width: 10px; }
  #res::-webkit-scrollbar-thumb { background: var(--line); border: 3px solid var(--surface); border-radius: 6px; }
  #res li { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; cursor: pointer; }
  #res li.sel { background: var(--surface-2); }
  #res .k { flex: none; width: 74px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  #res .k.srv { color: var(--accent-2); }
  #res .k.fav { color: #ffc861; }
  #res .l { flex: none; max-width: 55%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #res .s { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font: 12px var(--mono); }
  .box footer { display: flex; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <div id="strip">
    <div class="brand"><img src="build/icon.png" alt="">Nova</div>
    <div id="mini" hidden>
      <button id="mplay" aria-label="Reproducir o pausar"></button>
      <button id="mnext" aria-label="Siguiente video"><svg viewBox="0 0 24 24"><path d="M5 5l10 7-10 7zM19 5v14"/></svg></button>
      <span id="mtitle" role="button" tabindex="0" title="Ir a la pestaña"></span>
    </div>
    <div id="tabs"></div>
    <button id="new" title="Nueva pestaña (Ctrl+T)" aria-label="Nueva pestaña"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div id="bar">
    <button id="back" title="Atrás (Alt+←)" aria-label="Atrás"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="fwd" title="Adelante (Alt+→)" aria-label="Adelante"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button id="reload" title="Recargar (Ctrl+R)" aria-label="Recargar"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
    <button id="home" title="Inicio" aria-label="Inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></button>
    <label class="field" id="omni">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="url" spellcheck="false" placeholder="Busca en Google o escribe una dirección" aria-label="Dirección">
      <button id="star" class="mini" title="Guardar en favoritos (Ctrl+D)" aria-label="Guardar en favoritos" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg></button>
      <kbd>Ctrl K</kbd>
    </label>
    <div class="field" id="findbar" hidden>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="fq" spellcheck="false" placeholder="Buscar en la página" aria-label="Buscar en la página">
      <span id="hits"></span>
      <button id="fprev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
      <button id="fnext" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button id="fclose" aria-label="Cerrar búsqueda"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <button id="errs" hidden title="Copiar paquete de depuración para la IA (Ctrl+Shift+E)"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span id="errn">0</span></button>
    <button id="yt" hidden title="Opciones de YouTube" aria-label="Opciones de YouTube"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/></svg></button>
    <button id="ai" title="Nova IA: resume y pregunta (Ctrl+J)" aria-label="Nova IA"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg></button>
    <button id="pick" title="Señalar elemento a la IA (Ctrl+Shift+X)" aria-label="Señalar elemento a la IA"><svg viewBox="0 0 24 24"><path d="M3 3l7.1 17 2.5-7.4L20 10.1z"/><path d="M13 13l6 6"/></svg></button>
    <button id="split" title="Vista dividida (Ctrl+\)" aria-label="Vista dividida"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
    <button id="pip" title="Video flotante (Ctrl+Shift+P)" aria-label="Video flotante"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1"/></svg></button>
    <div class="sep"></div>
    <div id="shield" title="Anuncios y rastreadores bloqueados">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
      <span id="count">0</span>
    </div>
    <div id="toast" role="status"></div>
  </div>

  <nav id="favbar" hidden aria-label="Barra de favoritos"><div id="favs"></div><button id="favmore" hidden title="Más favoritos" aria-label="Más favoritos">»</button></nav>

  <div id="pal" hidden>
    <div class="box" role="dialog" aria-label="Paleta de comandos">
      <label class="field">
        <svg viewBox="0 0 24 24"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg>
        <input id="q" spellcheck="false" placeholder="Pestañas, historial, servidores locales o comandos…" aria-label="Buscar comando">
      </label>
      <ul id="res" role="listbox"></ul>
      <footer><span><kbd>↑</kbd> <kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> cerrar</span></footer>
    </div>
  </div>
<script>
  const $ = id => document.getElementById(id);
  const url = $('url'), fq = $('fq'), q = $('q');
  const fmt = n => n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : n.toLocaleString('es');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const x = '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const SOUND = '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const MUTED = '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
  let S = { tabs: [] }, P = { history: [], servers: [] };

  for (const id of ['back', 'fwd', 'reload', 'home', 'pip', 'split', 'pick', 'ai']) $(id).onclick = () => nova.cmd(id);
  const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 4v16M17 4v16"/></svg>';
  $('mplay').onclick = () => S.media && nova.cmd('mediaToggle', S.media.id);
  $('mnext').onclick = () => S.media && nova.cmd('mediaNext', S.media.id);
  $('mtitle').onclick = () => S.media && nova.cmd('select', S.media.id);
  $('mtitle').onkeydown = e => { if (e.key === 'Enter') $('mtitle').click(); };
  $('new').onclick = () => nova.cmd('newTab');
  $('errs').onclick = () => nova.cmd('copyErrors');
  $('yt').onclick = () => { const r = $('yt').getBoundingClientRect(); nova.cmd('ytMenu', { x: r.left, y: r.bottom + 4 }); };
  url.onkeydown = e => {
    if (e.key === 'Enter' && url.value.trim()) { nova.cmd('go', url.value); url.blur(); }
    if (e.key === 'Escape') url.blur();
  };
  url.onfocus = () => url.select();

  $('star').onclick = e => { e.preventDefault(); nova.cmd('bookmark'); };
  $('tabs').onclick = e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    const btn = e.target.closest('button');
    nova.cmd(!btn ? 'select' : btn.classList.contains('snd') ? 'mute' : 'close', +tab.dataset.id);
  };
  $('tabs').onauxclick = e => { const tab = e.target.closest('.tab'); if (tab && e.button === 1) nova.cmd('close', +tab.dataset.id); };

  // Find in page
  const findMode = on => {
    $('omni').hidden = on; $('findbar').hidden = !on;
    if (on) { fq.focus(); fq.select(); if (fq.value) nova.cmd('find', { text: fq.value }); }
    else { $('hits').textContent = ''; nova.cmd('findStop'); }
  };
  fq.oninput = () => nova.cmd('find', { text: fq.value });
  fq.onkeydown = e => {
    if (e.key === 'Enter') nova.cmd('find', { text: fq.value, next: true, back: e.shiftKey });
    if (e.key === 'Escape') findMode(false);
  };
  $('fnext').onclick = () => nova.cmd('find', { text: fq.value, next: true });
  $('fprev').onclick = () => nova.cmd('find', { text: fq.value, next: true, back: true });
  $('fclose').onclick = () => findMode(false);
  nova.on('find', () => findMode(true));
  nova.on('found', r => { $('hits').textContent = r.matches ? `${r.activeMatchOrdinal}/${r.matches}` : 'sin resultados'; });

  // Toast
  let toastT;
  nova.on('toast', msg => {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
  });

  // Command palette
  const COMMANDS = [
    ['Nova IA: resumir y preguntar', 'Ctrl+J', 'ai'],
    ['Mi Nova Wrapped', 'tiempo recuperado este mes', 'wrapped'],
    ['Video flotante automático', () => S.yt?.autoPip ? 'activado' : 'desactivado', () => nova.cmd('yt', 'autoPip')],
    ['Guardar en favoritos', 'Ctrl+D', 'bookmark'],
    ['Mostrar u ocultar barra de favoritos', 'Ctrl+Shift+B', () => nova.cmd('yt', 'favBar')],
    ['Importar desde Chrome', 'favoritos e historial', () => nova.cmd('import', 'Chrome')],
    ['Importar desde Edge', 'favoritos e historial', () => nova.cmd('import', 'Edge')],
    ['Importar desde Brave', 'favoritos e historial', () => nova.cmd('import', 'Brave')],
    ['Hacer Nova mi navegador predeterminado', '', 'makeDefault'],
    ['Silenciar o activar sonido de la pestaña', 'Ctrl+Shift+M', 'mute'],
    ['Señalar elemento a la IA', 'Ctrl+Shift+X', 'pick'],
    ['Copiar paquete de depuración', 'Ctrl+Shift+E', 'copyErrors'],
    ['Vista dividida', 'Ctrl+\\', 'split'],
    ['Captura al portapapeles', 'Ctrl+Shift+S', 'shot'],
    ['Herramientas de desarrollo', 'F12', 'devtools'],
    ['Recargar sin caché', 'Ctrl+Shift+R', 'hardReload'],
    ['Borrar datos de este sitio', 'cookies, storage, caché', 'clearSite'],
    ['Copiar URL', '', 'copyUrl'],
    ['Buscar en la página', 'Ctrl+F', () => findMode(true)],
    ['Nueva pestaña', 'Ctrl+T', 'newTab'],
    ['Reabrir pestaña cerrada', 'Ctrl+Shift+T', 'reopen'],
    ['Video flotante', 'Ctrl+Shift+P', 'pip'],
    ['Restablecer zoom', 'Ctrl+0', () => nova.cmd('zoom', 0)],
  ];
  let items = [], sel = 0;
  const host = u => { try { const h = new URL(u); return h.host + h.pathname.replace(/\/$/, ''); } catch { return u; } };
  const match = (needle, ...hay) => { const s = hay.join(' ').toLowerCase(); return needle.every(w => s.includes(w)); };

  function build() {
    const v = q.value.trim(), n = v.toLowerCase().split(/\s+/).filter(Boolean);
    const all = [
      ...P.servers.map(s => ({ k: 'Servidor', cls: 'srv', l: `localhost:${s.port}`, s: s.title || 'servidor local', run: () => nova.cmd('open', s.url) })),
      ...S.tabs.map(t => ({ k: 'Pestaña', l: t.title, s: host(t.url), run: () => nova.cmd('select', t.id) })),
      ...(P.bookmarks || []).map(b => ({ k: 'Favorito', cls: 'fav', l: b.title, s: host(b.url), run: () => nova.cmd('go', b.url) })),
      ...COMMANDS.map(([l, s, c]) => ({ k: 'Comando', l, s: typeof s === 'function' ? s() : s, run: typeof c === 'function' ? c : () => nova.cmd(c) })),
      ...Object.entries(S.ytLabels || {}).map(([key, l]) => ({ k: 'YouTube', l, s: S.yt[key] ? 'activado' : 'desactivado', run: () => nova.cmd('yt', key) })),
      ...P.history.map(h => ({ k: 'Historial', l: h.title, s: host(h.url), run: () => nova.cmd('go', h.url) })),
    ];
    // Empty query: everything but the long lists, then a taste of favorites and history.
    items = n.length ? all.filter(i => match(n, i.l, i.s))
      : all.filter(i => i.k !== 'Historial' && i.k !== 'Favorito').concat(all.filter(i => i.k === 'Favorito').slice(0, 5), all.filter(i => i.k === 'Historial').slice(0, 5));
    items = items.slice(0, 60);
    if (v) items.push({ k: 'Ir', l: v, s: /\s/.test(v) || !/[.:]/.test(v) ? 'buscar en Google' : 'abrir', run: () => nova.cmd('go', v) });
    sel = 0;
    draw();
  }
  function draw() {
    $('res').innerHTML = items.map((i, n) => `<li role="option" class="${n === sel ? 'sel' : ''}" data-n="${n}">
      <span class="k ${i.cls || ''}">${i.k}</span><span class="l">${esc(i.l)}</span><span class="s">${esc(i.s)}</span></li>`).join('');
    $('res').querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
  }
  function closePal() { $('pal').hidden = true; nova.cmd('overlay', false); }
  function runSel(n) { const it = items[n]; if (!it) return; $('pal').hidden = true; nova.cmd('overlay', false); it.run(); }
  q.oninput = build;
  q.onkeydown = e => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, items.length - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') runSel(sel);
    else if (e.key === 'Escape') closePal();
  };
  $('res').onclick = e => { const li = e.target.closest('li'); if (li) runSel(+li.dataset.n); };
  $('res').onmousemove = e => { const li = e.target.closest('li'); if (li && +li.dataset.n !== sel) { sel = +li.dataset.n; draw(); } };
  $('pal').onmousedown = e => { if (e.target === $('pal')) closePal(); };
  nova.on('palette', d => { P = d; $('pal').hidden = false; q.value = ''; build(); q.focus(); });
  nova.on('servers', s => { P.servers = s; if (!$('pal').hidden) { const keep = sel; build(); sel = Math.min(keep, items.length - 1); draw(); } });

  // Bookmarks bar: click opens here, middle click in a new tab, right click for options; what doesn't fit goes behind ».
  let FAVS = [];
  const tintOf = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 55% 45%)`; };
  const favHost = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
  function layoutFavs() {
    const box = $('favs'), items = [...box.children];
    items.forEach(el => el.hidden = false);
    const limit = box.getBoundingClientRect().right;
    const hidden = items.filter(el => el.getBoundingClientRect().right > limit);
    hidden.forEach(el => el.hidden = true);
    $('favmore').hidden = !hidden.length;
    $('favmore').dataset.urls = JSON.stringify(hidden.map(el => el.dataset.url));
  }
  nova.on('favs', ({ show, list }) => {
    FAVS = list;
    $('favbar').hidden = !show;
    $('favs').innerHTML = list.map(b => {
      const name = b.title && b.title !== b.url ? b.title : favHost(b.url);
      const icon = b.icon ? `<img src="${esc(b.icon)}" alt="">` : `<i style="background:${tintOf(favHost(b.url))}">${esc((name[0] || '?').toUpperCase())}</i>`;
      return `<button class="bm" data-url="${esc(b.url)}" title="${esc(name)}\n${esc(b.url)}">${icon}<span>${esc(name)}</span></button>`;
    }).join('');
    requestAnimationFrame(layoutFavs);
  });
  addEventListener('resize', () => !$('favbar').hidden && layoutFavs());
  $('favs').onclick = e => { const f = e.target.closest('.bm'); if (f) nova.cmd('favOpen', { url: f.dataset.url, tab: e.ctrlKey }); };
  $('favs').onauxclick = e => { const f = e.target.closest('.bm'); if (f && e.button === 1) nova.cmd('favOpen', { url: f.dataset.url, tab: true }); };
  $('favs').oncontextmenu = e => { const f = e.target.closest('.bm'); if (f) { e.preventDefault(); nova.cmd('favMenu', { url: f.dataset.url, x: e.clientX, y: e.clientY }); } };
  $('favmore').onclick = () => { const r = $('favmore').getBoundingClientRect(); nova.cmd('favMore', { urls: JSON.parse($('favmore').dataset.urls || '[]'), x: r.left, y: r.bottom }); };

  nova.on('blocked', n => $('count').textContent = fmt(n));
  nova.on('focus-url', () => { findMode(false); url.focus(); });
  nova.on('state', s => {
    S = s;
    $('tabs').innerHTML = s.tabs.map(t => `
      <div class="tab${t.id === s.active ? ' on' : ''}${t.id === s.split ? ' split' : ''}${t.loading ? ' loading' : ''}${t.sleeping ? ' sleep' : ''}" data-id="${t.id}" title="${esc(t.title)}">
        ${t.favicon && !t.loading ? `<img src="${esc(t.favicon)}" alt="">` : '<i class="dot"></i>'}
        <span>${esc(t.title)}</span>
        ${t.errors ? `<b title="Errores">${t.errors}</b>` : ''}
        ${t.audible || t.muted ? `<button class="snd${t.muted ? ' muted' : ''}" title="${t.muted ? 'Activar sonido' : 'Silenciar'}" aria-label="${t.muted ? 'Activar sonido' : 'Silenciar'}">${t.muted ? MUTED : SOUND}</button>` : ''}
        <button class="x" aria-label="Cerrar pestaña">${x}</button>
      </div>`).join('');
    const cur = s.tabs.find(t => t.id === s.active);
    if (cur && document.activeElement !== url) url.value = cur.url;
    $('back').disabled = !s.canBack;
    $('fwd').disabled = !s.canFwd;
    $('split').classList.toggle('on', s.split != null);
    $('yt').hidden = !s.youtube;
    $('ai').classList.toggle('on', !!s.aiOpen);
    $('mini').hidden = !s.media;
    if (s.media) {
      $('mplay').innerHTML = s.media.playing ? PAUSE : PLAY;
      $('mplay').setAttribute('aria-label', s.media.playing ? 'Pausar' : 'Reproducir');
      $('mnext').hidden = !s.media.yt;
      $('mtitle').textContent = s.media.title.replace(/ - YouTube$/, '');
    }
    $('star').classList.toggle('on', !!s.bookmarked);
    $('star').setAttribute('aria-pressed', !!s.bookmarked);
    $('star').title = s.bookmarked ? 'Quitar de favoritos (Ctrl+D)' : 'Guardar en favoritos (Ctrl+D)';
    $('errs').hidden = !cur?.errors;
    $('errn').textContent = cur?.errors || 0;
    $('count').textContent = fmt(s.blocked);
  });
</script>
</body>
</html>
